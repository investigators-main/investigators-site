<!DOCTYPE html>
<html>
<head>
<title>The Investigators</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: url("7EA814AB-4C79-4817-83B5-94897C27B378.jpeg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
    }

    .panel {
        display: none;
        margin: 40px auto;
        width: 90%;
        max-width: 450px;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .btn {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        background: black;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .item-box {
        background: #eee;
        padding: 10px;
        margin-top: 10px;
        border-radius: 5px;
    }
</style>
</head>
<body>

<!-- MAIN BUTTONS -->
<div class="panel" style="display:block;">
    <h1>The Investigators</h1>
    <button class="btn" onclick="showJoin()">I want to join</button>
    <button class="btn" onclick="showLogin()">Member Login</button>
    <button class="btn" onclick="showAdminLogin()">Admin Login</button>
</div>

<!-- JOIN FORM -->
<div id="joinForm" class="panel">
    <h2>Join the Team</h2>
    <input id="joinName" placeholder="Your Name" class="btn" style="background:white;color:black;border:1px solid #ccc;">
    <textarea id="joinReason" placeholder="Why do you want to join?" class="btn" style="background:white;color:black;border:1px solid #ccc;height:80px;"></textarea>
    <input id="joinUser" placeholder="Username" class="btn" style="background:white;color:black;border:1px solid #ccc;">
    <input id="joinPass" type="password" placeholder="Password" class="btn" style="background:white;color:black;border:1px solid #ccc;">
    <p id="joinError" style="color:red;"></p>
    <button class="btn" onclick="submitJoin()">Submit</button>
    <button class="btn" onclick="hideAll()">Back</button>
</div>

<!-- LOGIN FORM -->
<div id="loginForm" class="panel">
    <h2>Member Login</h2>
    <input id="loginUser" placeholder="Username" class="btn" style="background:white;color:black;border:1px solid #ccc;">
    <input id="loginPass" type="password" placeholder="Password" class="btn" style="background:white;color:black;border:1px solid #ccc;">
    <p id="loginError" style="color:red;"></p>
    <button class="btn" onclick="memberLogin()">Login</button>
    <button class="btn" onclick="hideAll()">Back</button>
</div>

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="panel">
    <h2>Admin Login</h2>
    <input id="adminUser" placeholder="Username" class="btn" style="background:white;color:black;border:1px solid #ccc;">
    <input id="adminPass" type="password" placeholder="Password" class="btn" style="background:white;color:black;border:1px solid #ccc;">
    <p id="adminError" style="color:red;"></p>
    <button class="btn" onclick="adminLogin()">Login</button>
    <button class="btn" onclick="hideAll()">Back</button>
</div>

<!-- MEMBER PANEL -->
<div id="memberPanel" class="panel">
    <h2>Current Case</h2>
    <div id="memberCaseBox"></div>
    <button class="btn" onclick="showCaseHistory()">Case History</button>
    <button class="btn" onclick="hideAll()">Log Out</button>
</div>

<!-- CASE HISTORY -->
<div id="historyPanel" class="panel">
    <h2>Case History</h2>
    <div id="historyBox"></div>
    <button class="btn" onclick="hideAll()">Back</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel" class="panel">
    <h2>Admin Panel</h2>

    <h3>Pending Requests</h3>
    <div id="requestBox"></div>

    <h3>Members</h3>
    <div id="memberBox"></div>

    <h3>Current Case</h3>
    <textarea id="caseText" placeholder="Describe the case..." class="btn" style="background:white;color:black;border:1px solid #ccc;height:80px;"></textarea>
    <button class="btn" onclick="createCase()">New Case</button>
    <button class="btn" onclick="completeCase()">Mark Case Complete</button>
    <button class="btn" onclick="deleteCase()">Delete Case</button>

    <button class="btn" onclick="hideAll()">Log Out</button>
</div>

<script>
/* ---------- LOAD DATA ---------- */

if (!localStorage.getItem("requests")) localStorage.setItem("requests", JSON.stringify([]));
if (!localStorage.getItem("members")) localStorage.setItem("members", JSON.stringify([]));
if (!localStorage.getItem("cases")) localStorage.setItem("cases", JSON.stringify([]));

/* ---------- PANEL FUNCTIONS ---------- */

function hideAll() {
    document.querySelectorAll(".panel").forEach(p => p.style.display = "none");
    document.querySelector(".panel").style.display = "block";
}

function showJoin() { hideAll(); joinForm.style.display = "block"; }
function showLogin() { hideAll(); loginForm.style.display = "block"; }
function showAdminLogin() { hideAll(); adminLogin.style.display = "block"; }

/* ---------- JOIN REQUEST ---------- */

function submitJoin() {
    let name = joinName.value.trim();
    let reason = joinReason.value.trim();
    let user = joinUser.value.trim();
    let pass = joinPass.value.trim();

    let requests = JSON.parse(localStorage.getItem("requests"));
    let members = JSON.parse(localStorage.getItem("members"));

    if (!name || !reason || !user || !pass) {
        joinError.innerText = "All fields are required.";
        return;
    }

    if (requests.find(r => r.user === user) || members.find(m => m.user === user)) {
        joinError.innerText = "Username already used.";
        return;
    }

    requests.push({ name, reason, user, pass });
    localStorage.setItem("requests", JSON.stringify(requests));

    alert("Request sent!");
    hideAll();
}

/* ---------- MEMBER LOGIN ---------- */

function memberLogin() {
    let user = loginUser.value.trim();
    let pass = loginPass.value.trim();

    let members = JSON.parse(localStorage.getItem("members"));

    let match = members.find(m => m.user === user && m.pass === pass);

    if (!match) {
        loginError.innerText = "Invalid login.";
        return;
    }

    loadMemberPanel();
}

function loadMemberPanel() {
    hideAll();
    memberPanel.style.display = "block";

    let cases = JSON.parse(localStorage.getItem("cases"));
    let current = cases.find(c => !c.done);

    if (!current) memberCaseBox.innerHTML = "<p>No active case.</p>";
    else memberCaseBox.innerHTML = `<div class="item-box">${current.text}</div>`;
}

/* ---------- CASE HISTORY ---------- */

function showCaseHistory() {
    hideAll();
    historyPanel.style.display = "block";

    let cases = JSON.parse(localStorage.getItem("cases"));
    let doneCases = cases.filter(c => c.done);

    if (doneCases.length === 0) {
        historyBox.innerHTML = "<p>No completed cases yet.</p>";
        return;
    }

    historyBox.innerHTML = doneCases.map((c,i)=>`
        <div class="item-box"><b>Case #${i+1}</b><br>${c.text}</div>
    `).join("");
}

/* ---------- ADMIN LOGIN ---------- */

function adminLogin() {
    let user = adminUser.value;
    let pass = adminPass.value;

    if (user !== "wassim&jordan" || pass !== "the investigators") {
        adminError.innerText = "Incorrect admin login.";
        return;
    }

    loadAdminPanel();
}

function loadAdminPanel() {
    hideAll();
    adminPanel.style.display = "block";
    loadRequests();
    loadMembers();
}

/* ---------- ADMIN: REQUESTS ---------- */

function loadRequests() {
    let requests = JSON.parse(localStorage.getItem("requests"));
    requestBox.innerHTML = requests.length ? "" : "<p>No requests.</p>";

    requests.forEach((r,i)=> {
        requestBox.innerHTML += `
        <div class="item-box">
            <b>${r.name}</b><br>${r.reason}<br>
            <button class="btn" onclick="acceptRequest(${i})">Accept</button>
            <button class="btn" onclick="declineRequest(${i})">Decline</button>
        </div>`;
    });
}

function acceptRequest(i) {
    let requests = JSON.parse(localStorage.getItem("requests"));
    let members = JSON.parse(localStorage.getItem("members"));

    members.push(requests[i]);
    requests.splice(i,1);

    localStorage.setItem("requests", JSON.stringify(requests));
    localStorage.setItem("members", JSON.stringify(members));

    loadRequests();
    loadMembers();
}

function declineRequest(i) {
    let requests = JSON.parse(localStorage.getItem("requests"));
    requests.splice(i,1);
    localStorage.setItem("requests", JSON.stringify(requests));
    loadRequests();
}

/* ---------- ADMIN: MEMBERS ---------- */

function loadMembers() {
    let members = JSON.parse(localStorage.getItem("members"));
    memberBox.innerHTML = "";

    members.forEach((m,i)=> {
        memberBox.innerHTML += `
        <div class="item-box">
            <b>${m.name}</b> (${m.user})
            <button class="btn" onclick="removeMember(${i})">Remove</button>
        </div>`;
    });
}

function removeMember(i) {
    let members = JSON.parse(localStorage.getItem("members"));
    members.splice(i,1);
    localStorage.setItem("members", JSON.stringify(members));
    loadMembers();
}

/* ---------- ADMIN: CASE MANAGEMENT ---------- */

function createCase() {
    let text = caseText.value.trim();
    if (!text) return alert("Enter a case description.");

    let cases = JSON.parse(localStorage.getItem("cases"));

    // Only 1 active case at a time
    cases.forEach(c => c.done = true);

    cases.push({ text, done:false });

    localStorage.setItem("cases", JSON.stringify(cases));

    alert("New case created!");
}

function completeCase() {
    let cases = JSON.parse(localStorage.getItem("cases"));
    let current = cases.find(c => !c.done);

    if (!current) return alert("No active case to complete.");

    current.done = true;
    localStorage.setItem("cases", JSON.stringify(cases));

    alert("Case marked complete!");
}

function deleteCase() {
    let cases = JSON.parse(localStorage.getItem("cases"));
    cases = cases.filter(c => c.done); // remove active case only
    localStorage.setItem("cases", JSON.stringify(cases));

    alert("Case deleted!");
}
</script>

</body>
</html>
